name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
# Cancel superseded pull request runs (A10, RU5); pushes to main never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v2.14.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      # RU6/RU8: distribution is Bazel only (signed tag, GitHub release and a
      # xoxd-ai/bazel-registry entry). Nothing is published to npmjs or GitHub
      # Packages. On ci-templates v2.x this input must stay `disabled`, because
      # it defaults to `required` and would run an npm publish dry-run.
      npm_publish_mode: disabled
      node_versions: '["22"]'
      pnpm_version: "10.13.1"
      typecheck_command: pnpm typecheck
      unit_test_command: pnpm test
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:pkg //:test"
      package_dir: ./bazel-bin/pkg
    secrets: inherit
